name: Verify secrets

# Manual check that every secret the pipeline needs is present and works.
# It reports pass or fail per name and never prints a value.

on:
  workflow_dispatch:

permissions: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check secrets by name and by use
        env:
          SWEEP_GITHUB_TOKEN: ${{ secrets.SWEEP_GITHUB_TOKEN }}
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
        run: |
          node <<'EOF'
          const names = [
            "SWEEP_GITHUB_TOKEN",
            "VERCEL_DEPLOY_HOOK_URL",
            "REVALIDATE_SECRET",
          ];
          let failed = false;
          const report = (name, ok, note = "") => {
            console.log(`${ok ? "ok  " : "FAIL"} ${name}${note ? ` (${note})` : ""}`);
            if (!ok) failed = true;
          };
          const env = (name) => (process.env[name] ?? "").trim();

          (async () => {
            for (const name of names) report(`${name} present`, env(name).length > 0);

            report(
              "VERCEL_DEPLOY_HOOK_URL shape",
              env("VERCEL_DEPLOY_HOOK_URL").startsWith("https://api.vercel.com/v1/integrations/deploy/"),
            );

            const rate = async (token) => {
              const response = await fetch("https://api.github.com/graphql", {
                method: "POST",
                headers: { authorization: `bearer ${token}`, "user-agent": "contributable-verify" },
                body: JSON.stringify({ query: "{ rateLimit { limit remaining } }" }),
              });
              const body = await response.json().catch(() => null);
              return { status: response.status, limit: body?.data?.rateLimit?.limit ?? null };
            };

            const sweep = await rate(env("SWEEP_GITHUB_TOKEN"));
            report("SWEEP_GITHUB_TOKEN works", sweep.status === 200 && sweep.limit !== null, `limit ${sweep.limit}`);

            process.exit(failed ? 1 : 0);
          })();
          EOF
