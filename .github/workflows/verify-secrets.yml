name: Verify secrets

# Manual check that every secret the pipeline needs is present and works.
# It reports pass or fail per name and never prints a value.

on:
  workflow_dispatch:

permissions: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check secrets by name and by use
        env:
          SWEEP_GITHUB_TOKEN: ${{ secrets.SWEEP_GITHUB_TOKEN }}
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
          GH_APP_ID: ${{ secrets.GH_APP_ID }}
          GH_APP_INSTALLATION_ID: ${{ secrets.GH_APP_INSTALLATION_ID }}
          GH_APP_PRIVATE_KEY_B64: ${{ secrets.GH_APP_PRIVATE_KEY_B64 }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
        run: |
          node <<'EOF'
          const crypto = require("node:crypto");
          const names = [
            "SWEEP_GITHUB_TOKEN",
            "VERCEL_DEPLOY_HOOK_URL",
            "GH_APP_ID",
            "GH_APP_INSTALLATION_ID",
            "GH_APP_PRIVATE_KEY_B64",
            "REVALIDATE_SECRET",
          ];
          let failed = false;
          const report = (name, ok, note = "") => {
            console.log(`${ok ? "ok  " : "FAIL"} ${name}${note ? ` (${note})` : ""}`);
            if (!ok) failed = true;
          };
          const env = (name) => (process.env[name] ?? "").trim();

          (async () => {
            for (const name of names) report(`${name} present`, env(name).length > 0);

            report(
              "VERCEL_DEPLOY_HOOK_URL shape",
              env("VERCEL_DEPLOY_HOOK_URL").startsWith("https://api.vercel.com/v1/integrations/deploy/"),
            );

            const rate = async (token) => {
              const response = await fetch("https://api.github.com/graphql", {
                method: "POST",
                headers: { authorization: `bearer ${token}`, "user-agent": "contributable-verify" },
                body: JSON.stringify({ query: "{ rateLimit { limit remaining } }" }),
              });
              const body = await response.json().catch(() => null);
              return { status: response.status, limit: body?.data?.rateLimit?.limit ?? null };
            };

            const sweep = await rate(env("SWEEP_GITHUB_TOKEN"));
            report("SWEEP_GITHUB_TOKEN works", sweep.status === 200 && sweep.limit !== null, `limit ${sweep.limit}`);

            try {
              const key = Buffer.from(env("GH_APP_PRIVATE_KEY_B64"), "base64").toString("utf8");
              const now = Math.floor(Date.now() / 1000);
              const b64 = (value) => Buffer.from(JSON.stringify(value)).toString("base64url");
              const unsigned = `${b64({ alg: "RS256", typ: "JWT" })}.${b64({ iat: now - 60, exp: now + 300, iss: env("GH_APP_ID") })}`;
              const jwt = `${unsigned}.${crypto.sign("RSA-SHA256", Buffer.from(unsigned), key).toString("base64url")}`;
              const response = await fetch(
                `https://api.github.com/app/installations/${env("GH_APP_INSTALLATION_ID")}/access_tokens`,
                {
                  method: "POST",
                  headers: {
                    authorization: `bearer ${jwt}`,
                    accept: "application/vnd.github+json",
                    "user-agent": "contributable-verify",
                  },
                },
              );
              const body = await response.json().catch(() => null);
              if (body?.token) console.log(`::add-mask::${body.token}`);
              report("GitHub App installation token", response.status === 201 && Boolean(body?.token));
              if (body?.token) {
                const app = await rate(body.token);
                report("GitHub App token works", app.status === 200 && app.limit !== null, `limit ${app.limit}`);
              }
            } catch {
              report("GitHub App private key", false, "could not sign");
            }

            process.exit(failed ? 1 : 0);
          })();
          EOF
